# VendorMesh – local full stack:  docker compose up --build
# UI -> http://localhost:3000   API -> http://localhost:5000
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    # Values below override .env so the container talks to the compose network, not localhost.
    environment:
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongodb:27017/vendormesh
      CLIENT_ORIGIN: http://localhost:3000
      PUBLIC_API_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""   # empty => same-origin; nginx proxies /api to the backend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
