openapi: 3.1.0
info:
  title: VendorMesh Workspace API
  version: 0.2.0
  description: |
    Documents the authenticated workspace API plus a separately versioned, read-only API-key surface
    for inventory, suppliers and purchase requests. Workspace identifiers are derived from the key or
    signed-in session, not request bodies. Legacy operator-token AI/treasury/payment routes are omitted.
servers:
  - url: http://localhost:5000
    description: Local backend
security:
  - BearerSession: []
tags:
  - name: Health
  - name: Authentication
  - name: Workspace
  - name: Inventory
  - name: Suppliers
  - name: Purchasing
  - name: Intelligence
  - name: Audit
paths:
  /health/live:
    get:
      security: []
      tags: [Health]
      summary: Process liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: { type: object, properties: { status: { const: ok } } }
  /health/ready:
    get:
      security: []
      tags: [Health]
      summary: Database readiness
      responses:
        '200': { description: Database is available }
        '503': { description: Database is not ready }
  /api/auth/register:
    post:
      security: []
      tags: [Authentication]
      summary: Create a user and workspace
      description: Registration and login are limited to 20 requests per client IP per 15 minutes per backend process.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, companyName]
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 200 }
                companyName: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/login:
    post:
      security: []
      tags: [Authentication]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Current identity and workspace
      responses:
        '200':
          description: Signed-in user and active workspace
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  company: { $ref: '#/components/schemas/Workspace' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/summary:
    get:
      tags: [Workspace]
      summary: Workspace metrics and recent requests
      responses:
        '200':
          description: Workspace-scoped summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  inventoryCount: { type: integer }
                  supplierCount: { type: integer }
                  pendingApprovals: { type: integer }
                  totalUnits: { type: number }
                  lowStock: { type: integer }
                  inventoryValue: { type: number }
                  recentRequests: { type: array, items: { $ref: '#/components/schemas/PurchaseRequest' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/workspace/inventory:
    get:
      tags: [Inventory]
      summary: List up to 1000 inventory items
      responses:
        '200':
          description: Inventory items
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InventoryItem' } }
    post:
      tags: [Inventory]
      summary: Create inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, onHand, reorderPoint, unitCost]
              properties:
                sku: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 180 }
                onHand: { type: number, minimum: 0 }
                reorderPoint: { type: number, minimum: 0 }
                unitCost: { type: number, minimum: 0 }
                dailyDemand: { type: number, minimum: 0 }
      responses:
        '201':
          description: Inventory item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workspace/inventory/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    patch:
      tags: [Inventory]
      summary: Update inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                sku: { type: string, maxLength: 80 }
                name: { type: string, maxLength: 180 }
                onHand: { type: number, minimum: 0 }
                reorderPoint: { type: number, minimum: 0 }
                unitCost: { type: number, minimum: 0 }
                dailyDemand: { type: number, minimum: 0 }
      responses:
        '200': { description: Inventory item updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Inventory]
      summary: Delete inventory item (owner/admin only)
      responses:
        '204': { description: Inventory item deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/workspace/suppliers:
    get:
      tags: [Suppliers]
      summary: List up to 1000 suppliers in the active workspace
      responses:
        '200': { description: Supplier array }
    post:
      tags: [Suppliers]
      summary: Create supplier contact
      description: Staff can provide name/email. Owner/admin can also set lead time, reliability, and payment terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 180 }
                email: { type: string, format: email, maxLength: 254 }
                leadTimeDays: { type: number, minimum: 0, maximum: 3650 }
                reliabilityScore: { type: number, minimum: 0, maximum: 100 }
                paymentTerms: { type: string, maxLength: 120 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Supplier created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/suppliers/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    patch:
      tags: [Suppliers]
      summary: Update supplier
      description: Staff cannot change lead time, reliability, activation state, or payment terms.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 180 }
                email: { type: string, format: email, maxLength: 254 }
                leadTimeDays: { type: number, minimum: 0, maximum: 3650 }
                reliabilityScore: { type: number, minimum: 0, maximum: 100 }
                active: { type: boolean }
                paymentTerms: { type: string, maxLength: 120 }
                notes: { type: string, maxLength: 2000 }
      responses:
        '200': { description: Supplier updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/workspace/purchase-requests:
    get:
      tags: [Purchasing]
      summary: List up to 500 purchase requests, newest first
      responses:
        '200': { description: Purchase request array }
    post:
      tags: [Purchasing]
      summary: Submit purchase request for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inventoryItemId, supplierId, quantity]
              properties:
                inventoryItemId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                supplierId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                quantity: { type: integer, minimum: 1, maximum: 1000000 }
                unitCost: { type: number, minimum: 0 }
                rationale: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Pending request created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/workspace/purchase-requests/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      tags: [Purchasing]
      summary: Approve or reject a pending request (owner/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Updated purchase request }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workspace/purchase-requests/{id}/transition:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      tags: [Purchasing]
      summary: Mark an approved request ordered, record receipts, or cancel (role-limited)
      description: |
        Ordered/cancelled transitions require owner/admin. Recording partial or complete goods receipt
        is allowed for workspace staff as well. receivedQuantity is cumulative, and a request can be
        marked received only when the full orderedQuantity has been recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ordered, partially_received, received, cancelled] }
                orderedQuantity: { type: integer, minimum: 1, maximum: 1000000 }
                receivedQuantity: { type: integer, minimum: 1, maximum: 1000000 }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: Purchase request workflow state updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workspace/recommendations:
    get:
      tags: [Intelligence]
      summary: Explainable supplier/replenishment suggestions; no orders placed
      responses:
        '200': { description: Recommendations with weighted supplier ranking explanations }
  /api/workspace/forecast:
    get:
      tags: [Intelligence]
      summary: Inventory coverage baseline
      description: Uses configured daily demand. Does not use historical sales or claim ML accuracy.
      responses:
        '200': { description: Forecast estimates with explicit limitations }
  /api/workspace/anomalies:
    get:
      tags: [Intelligence]
      summary: Read-only procurement review signals
      description: Signals are not fraud findings and never change purchasing or payment state.
      responses:
        '200': { description: Review queue covering the latest 500 purchase requests }
  /api/workspace/audit-log:
    get:
      tags: [Audit]
      summary: List workspace audit events (owner/admin only)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: before
          description: ISO 8601 timestamp; return earlier events.
          schema: { type: string, format: date-time }
      responses:
        '200': { description: Audit page with entries and nextBefore timestamp }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/ai/settings:
    get:
      tags: [Intelligence]
      summary: Read masked AI provider configuration for the active workspace (owner/admin)
      responses:
        '200':
          description: Provider/model and masked key status only; plaintext secrets are never returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [anthropic, openai, gemini] }
                  model: { type: string }
                  keyConfigured: { type: boolean }
                  maskedKey: { type: string }
                  source: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Intelligence]
      summary: Save an encrypted provider credential for the active workspace (owner/admin)
      description: Replaces this workspace's credential. Send secrets only over HTTPS; the saved plaintext key is never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model, apiKey]
              properties:
                provider: { type: string, enum: [anthropic, openai, gemini] }
                model: { type: string, pattern: '^[a-zA-Z0-9._:-]{2,120}$' }
                apiKey: { type: string, minLength: 10, maxLength: 512, writeOnly: true }
      responses:
        '200': { description: Workspace provider saved; returns masked key status }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Intelligence]
      summary: Remove the saved AI credential for the active workspace (owner/admin)
      responses:
        '200': { description: Credential removed if one existed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/ai/settings/test:
    post:
      tags: [Intelligence]
      summary: Test a provider credential without saving it (owner/admin)
      description: Counts against the workspace daily request quota. The supplied key is used for this request only and is not stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model, apiKey]
              properties:
                provider: { type: string, enum: [anthropic, openai, gemini] }
                model: { type: string, pattern: '^[a-zA-Z0-9._:-]{2,120}$' }
                apiKey: { type: string, minLength: 10, maxLength: 512, writeOnly: true }
      responses:
        '200': { description: Provider accepted the test request }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: Provider test failed; response hides raw provider details }
  /api/workspace/ai/usage:
    get:
      tags: [Intelligence]
      summary: Read per-workspace AI quota and recent usage metadata (owner/admin)
      description: Does not return prompts, answers, API keys, or private provider response bodies.
      responses:
        '200':
          description: Daily quota and up to 50 recent usage events
          content:
            application/json:
              schema:
                type: object
                properties:
                  dayKey: { type: string, format: date }
                  dailyLimit: { type: integer }
                  requestsUsed: { type: integer }
                  requestsRemaining: { type: integer }
                  events: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/ai/ask:
    post:
      tags: [Intelligence]
      summary: Ask the workspace procurement copilot for advisory analysis (owner/admin)
      description: Uses the configured AI key for this workspace only. No tools or business mutations are available to the copilot. Question and relevant workspace context are sent to the configured provider; prompts and answers are not saved in the usage log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 3, maxLength: 4000 }
      responses:
        '200':
          description: Advisory answer and token usage when reported by provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  provider: { type: string }
                  model: { type: string }
                  advisoryOnly: { const: true }
                  usage: { type: object }
                  quota: { type: object }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: No provider credential has been configured for this workspace }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { description: Provider request failed; no raw provider response is returned }
  /api/workspace/invoices:
    get:
      tags: [Purchasing]
      summary: List invoice records for the active workspace
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: after
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: status
          schema: { type: string, enum: [pending_review, approved, rejected] }
      responses:
        '200':
          description: Tenant-scoped invoice page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  limit: { type: integer }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Purchasing]
      summary: Manually record an invoice against an approved or fulfilled purchase request
      description: |
        Invoice values are entered manually in this release. File uploads/OCR are not enabled.
        Creation queues the invoice for review and does not initiate any payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseRequestId, invoiceNumber, invoiceDate, currency, subtotal, taxTotal, total]
              properties:
                purchaseRequestId: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
                invoiceNumber: { type: string, minLength: 2, maxLength: 100 }
                invoiceDate: { type: string, format: date }
                dueDate: { type: [string, 'null'], format: date }
                currency: { type: string, pattern: '^[A-Za-z]{3}$' }
                subtotal: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
                taxTotal: { type: number, minimum: 0, maximum: 100000000 }
                total: { type: number, exclusiveMinimum: 0, maximum: 100000000 }
      responses:
        '201':
          description: Invoice stored in pending_review status; no payment initiated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workspace/invoices/{id}/review:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    post:
      tags: [Purchasing]
      summary: Approve or reject a pending invoice (owner/admin only)
      description: Approval of an amount or currency mismatch requires a review note; rejection requires a reason. Does not initiate payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Invoice reviewed; no payment initiated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/workspace/reconciliation:
    get:
      tags: [Purchasing]
      summary: Run read-only invoice-to-purchase-request reconciliation (owner/admin)
      description: |
        Checks the recent workspace invoice register and purchase requests for missing invoices,
        possible duplicate supplier invoice numbers, invoice totals above purchase totals, currency
        mismatches and pending review. Does not perform payment/settlement reconciliation.
      responses:
        '200':
          description: Deterministic review signals with window limits and explanatory evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  method: { type: string }
                  isReadOnly: { const: true }
                  warning: { type: string }
                  counts: { type: object }
                  signals: { type: array, items: { type: object, additionalProperties: true } }
                  window: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/pricing-simulator:
    post:
      tags: [Intelligence]
      summary: Estimate price scenarios; never writes actual prices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basePrice, unitCost, baselineUnits]
              properties:
                basePrice: { type: number, exclusiveMinimum: 0 }
                unitCost: { type: number, minimum: 0 }
                baselineUnits: { type: integer, minimum: 0, maximum: 9007199254740991 }
                elasticity: { type: number, minimum: 0, maximum: 5, default: 1.2 }
                competitorPrice: { type: [number, 'null'], exclusiveMinimum: 0 }
      responses:
        '200': { description: Advisory scenarios and assumptions }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/workspace/api-keys:
    get:
      tags: [Workspace]
      summary: List API key metadata for this workspace (owner/admin)
      responses:
        '200':
          description: List of keys without token secrets or hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { $ref: '#/components/schemas/WorkspaceAPIKey' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workspace]
      summary: Create a read-only workspace API key (owner/admin)
      description: The full token is returned once only. Store it in a secret manager; the database stores only its SHA-256 hash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 3, maxLength: 80 }
                scopes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, enum: [inventory:read, suppliers:read, purchasing:read] }
                expiresInDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: Key created; this response is the only place the full token is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      prefix: { type: string }
                      token: { type: string, writeOnly: true }
                      scopes: { type: array, items: { type: string } }
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
                  warning: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/workspace/api-keys/{id}:
    parameters:
      - $ref: '#/components/parameters/ObjectId'
    delete:
      tags: [Workspace]
      summary: Revoke an API key for this workspace (owner/admin)
      responses:
        '200': { description: API key revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/inventory:
    get:
      security: [{ WorkspaceAPIKeyBearer: [] }]
      tags: [Inventory]
      summary: List workspace inventory using a scoped read-only API key
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: after
          description: Object ID cursor returned by nextCursor.
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: sku
          description: Exact SKU match (case-normalized).
          schema: { type: string, maxLength: 80 }
        - in: query
          name: lowStock
          schema: { type: boolean }
      responses:
        '200': { description: Page of tenant-scoped inventory plus nextCursor }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/suppliers:
    get:
      security: [{ WorkspaceAPIKeyBearer: [] }]
      tags: [Suppliers]
      summary: List workspace suppliers using a scoped read-only API key
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: after
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: name
          description: Exact supplier name match.
          schema: { type: string, maxLength: 180 }
      responses:
        '200': { description: Page of tenant-scoped suppliers plus nextCursor }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/v1/purchase-requests:
    get:
      security: [{ WorkspaceAPIKeyBearer: [] }]
      tags: [Purchasing]
      summary: List workspace purchase requests using a read-only API key
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: after
          schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected, ordered, partially_received, received, cancelled] }
      responses:
        '200': { description: Page of tenant-scoped purchase request metadata plus nextCursor }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    BearerSession:
      type: http
      scheme: bearer
      bearerFormat: HMAC-signed VendorMesh session
    WorkspaceAPIKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: vmk workspace API key
  parameters:
    ObjectId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9]{24}$' }
  responses:
    BadRequest:
      description: Input validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid, or expired session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Workspace membership or role denies the action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Record not found in the active workspace
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Requested state conflicts with existing record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limit exceeded for this process or workspace quota
      headers:
        Retry-After:
          schema: { type: integer }
  schemas:
    Invoice:
      type: object
      properties:
        _id: { type: string }
        purchaseRequestId: { type: string }
        supplierId: { type: string }
        supplierName: { type: string }
        itemName: { type: string }
        sku: { type: string }
        purchaseRequestTotal: { type: number }
        invoiceNumber: { type: string }
        invoiceDate: { type: string, format: date-time }
        dueDate: { type: [string, 'null'], format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { type: number }
        taxTotal: { type: number }
        total: { type: number }
        status: { type: string, enum: [pending_review, approved, rejected] }
        createdBy: { type: string }
        reviewedBy: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewNote: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceAPIKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    AuthSession:
      type: object
      required: [token, expiresIn, user, company]
      properties:
        token: { type: string }
        expiresIn: { type: integer }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
        company:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            role: { type: string, enum: [owner, admin, staff] }
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
    Workspace:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        role: { type: string, enum: [owner, admin, staff] }
    InventoryItem:
      type: object
      properties:
        _id: { type: string }
        sku: { type: string }
        name: { type: string }
        onHand: { type: number }
        reorderPoint: { type: number }
        unitCost: { type: number }
        dailyDemand: { type: number }
        lowStock: { type: boolean }
        daysOfCover: { type: [number, 'null'] }
    PurchaseRequest:
      type: object
      properties:
        _id: { type: string }
        inventoryItemId: { type: string }
        supplierId: { oneOf: [{ type: string }, { type: object }] }
        itemName: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        orderedQuantity: { type: integer }
        receivedQuantity: { type: integer }
        orderedAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        statusHistory: { type: array, items: { type: object } }
        unitCost: { type: number }
        totalCost: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string, enum: [pending, approved, rejected, ordered, partially_received, received, cancelled] }
        rationale: { type: string }
        createdAt: { type: string, format: date-time }
