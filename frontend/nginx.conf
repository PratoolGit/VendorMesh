server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser never needs CORS in the Docker setup.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;   # the agent call (LLM + PayPal) can take a while
  }

  location / { try_files $uri /index.html; }
}
